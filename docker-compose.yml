version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: smarteval-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smarteval
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: smarteval-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarteval-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smarteval
      - USE_SQLITE=False
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=949f28c5a2c4e20798e4d372fa05b8cf0f230da37194f4a3de07b6bf89ab1e6d
      - USE_MOCK_AI=True
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarteval-celery-worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smarteval
      - USE_SQLITE=False
      - REDIS_URL=redis://redis:6379/0
      - USE_MOCK_AI=True
    depends_on:
      - db
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smarteval-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/evaluations
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
